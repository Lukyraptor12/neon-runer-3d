<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON RUNNER 3D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#07031a;font-family:"Trebuchet MS",system-ui,sans-serif;color:#e8f6ff}
canvas{display:block}
#hud{position:fixed;inset:0;z-index:3;pointer-events:none}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px 18px;padding:12px 16px}
.stat{font-size:11px;letter-spacing:.2em;color:#7fd8ff;text-transform:uppercase}
.stat b{display:block;font-size:clamp(18px,4vw,28px);color:#fff;text-shadow:0 0 12px #0ff;letter-spacing:.05em}
#turbo{width:150px;height:10px;border:1px solid #0ff;border-radius:6px;overflow:hidden;margin-top:8px}
#turboFill{height:100%;width:100%;box-shadow:0 0 10px #0ff}
.btn{pointer-events:auto;cursor:pointer;background:rgba(0,255,255,.1);color:#0ff;border:1px solid #0ff;border-radius:8px;padding:8px 14px;font:inherit;font-size:15px;transition:.15s}
.btn:hover{background:#0ff;color:#07031a;box-shadow:0 0 18px #0ff}
.btn.big{font-size:22px;padding:14px 44px;margin-top:22px;letter-spacing:.15em;text-transform:uppercase}
#touch{display:none;position:absolute;left:0;right:0;bottom:18px;padding:0 16px;justify-content:space-between}
#touch div{display:flex;gap:12px}
#touch .btn{width:68px;height:68px;font-size:26px;padding:0;background:rgba(0,255,255,.15)}
@media (pointer:coarse){#touch{display:flex}}
.panel{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:radial-gradient(circle,rgba(7,3,26,.45),rgba(7,3,26,.85))}
.panel.hidden{display:none}
h1{font-size:clamp(34px,9vw,84px);letter-spacing:.12em;color:#fff;text-shadow:0 0 14px #0ff,0 0 40px #f0f}
h1 span{color:#f0f}
h2{font-size:clamp(28px,7vw,52px);letter-spacing:.12em;color:#ff4a6a;text-shadow:0 0 20px #f03}
.panel p{max-width:520px;margin-top:14px;line-height:1.7;color:#bfe9ff}
.panel kbd{border:1px solid #0ff;border-radius:5px;padding:1px 7px;color:#0ff;font-size:.9em}
.big-n{font-size:46px;color:#fff;text-shadow:0 0 16px #0ff;margin-top:6px}
#flash{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(circle,transparent 25%,rgba(255,40,60,.8))}
#flash.hit{animation:hit .7s ease-out}
@keyframes hit{from{opacity:1}to{opacity:0}}
</style>
</head>
<body>
<div id="hud">
  <div class="top">
    <div class="stat">Puntos<b id="score">0</b></div>
    <div class="stat">Récord<b id="best">0</b></div>
    <div class="stat">Nivel <span id="lvl">1</span><b id="spd">0 km/h</b></div>
    <div class="stat">Turbo (Shift)<div id="turbo"><div id="turboFill"></div></div></div>
    <div><button class="btn" id="bPause" title="Pausa (P / Esc)">⏸</button> <button class="btn" id="bMute" title="Sonido">🔊</button></div>
  </div>
  <div id="touch">
    <div><button class="btn" id="tL">◀</button><button class="btn" id="tR">▶</button></div>
    <div><button class="btn" id="tD">⚡</button><button class="btn" id="tJ">▲</button></div>
  </div>
</div>
<div id="flash"></div>

<div class="panel" id="menu">
  <h1>NEON <span>RUNNER</span> 3D</h1>
  <p>Esquiva bloques y barreras, salta los obstáculos bajos y recoge orbes de energía.<br>
  <kbd>A</kbd>/<kbd>D</kbd> o <kbd>←</kbd>/<kbd>→</kbd> mover · <kbd>Espacio</kbd>/<kbd>↑</kbd>/<kbd>W</kbd> saltar<br>
  <kbd>Shift</kbd> turbo invulnerable · <kbd>P</kbd>/<kbd>Esc</kbd> pausa</p>
  <button class="btn big" id="bPlay">Jugar</button>
</div>
<div class="panel hidden" id="over">
  <h2>GAME OVER</h2>
  <p>Puntuación</p><div class="big-n" id="fScore">0</div>
  <p id="fBest"></p>
  <button class="btn big" id="bRetry">Reintentar</button>
</div>
<div class="panel hidden" id="pause">
  <h2 style="color:#0ff;text-shadow:0 0 20px #0ff">PAUSA</h2>
  <button class="btn big" id="bResume">Continuar</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';

/* ================= 1. UTILIDADES Y ESTADO ================= */
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const LANES = [-3.2, 0, 3.2];          // posiciones X de los 3 carriles
const DASH_DUR = 1.3, DASH_CD = 5;     // duración y enfriamiento del turbo (s)

let best = 0;
try { best = +localStorage.getItem('neonRunnerBest') || 0; } catch (e) {}

// Estado del juego: menu | playing | paused | over
const G = { state: 'menu', overReady: false, score: 0, time: 0, speed: 20, level: 1,
            dashT: 0, dashCd: 0, shake: 0, distAcc: 0 };
// Estado del jugador
const P = { lane: 1, x: 0, y: 0, vy: 0 };

/* ================= 2. AUDIO SINTÉTICO (Web Audio) ================= */
const SFX = {
  ctx: null, muted: false,
  init() {
    try {
      this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) {}
  },
  tone(f1, f2, d, type = 'sine', v = .15) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), t + d);
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g).connect(this.ctx.destination);
    o.start(t); o.stop(t + d);
  },
  noise(d, v) {
    if (!this.ctx || this.muted) return;
    const n = this.ctx.sampleRate * d | 0, b = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const c = b.getChannelData(0);
    for (let i = 0; i < n; i++) c[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = this.ctx.createBufferSource(), g = this.ctx.createGain();
    s.buffer = b; g.gain.value = v; s.connect(g).connect(this.ctx.destination); s.start();
  },
  orb()   { this.tone(700, 1500, .14, 'sine', .14); },
  jump()  { this.tone(220, 520, .2, 'square', .06); },
  dash()  { this.tone(120, 1100, .45, 'sawtooth', .09); },
  crash() { this.noise(.7, .4); this.tone(180, 30, .6, 'sawtooth', .2); }
};

/* ================= 3. ESCENA, LUCES Y NIEBLA ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07031a);
scene.fog = new THREE.FogExp2(0x07031a, 0.017);
const camera = new THREE.PerspectiveCamera(70, 1, .1,300);
let baseFov = 70;

scene.add(new THREE.AmbientLight(0x6655aa, .75));
const sun = new THREE.DirectionalLight(0xffffff, .9);
sun.position.set(6, 14, 6);
sun.target.position.set(0, 0, -8);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.radius = 4; sun.shadow.bias = -.0005;
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 30, bottom: -30, near: 1, far: 50 });
scene.add(sun, sun.target);

/* ================= 4. PISTA, PILARES Y ESTRELLAS ================= */
const floor = new THREE.Mesh(new THREE.BoxGeometry(10.4, .4, 180),
  new THREE.MeshStandardMaterial({ color: 0x0c0824, metalness: .7, roughness: .35 }));
floor.position.set(0, -.2, -80); floor.receiveShadow = true; scene.add(floor);

// Bordes luminosos y divisores de carril
[[-5.3, 0x00ffff], [5.3, 0xff2bd6]].forEach(([x, c]) => {
  const e = new THREE.Mesh(new THREE.BoxGeometry(.3, .35, 180), new THREE.MeshBasicMaterial({ color: c }));
  e.position.set(x, .05, -80); scene.add(e);
});
[-1.6, 1.6].forEach(x => {
  const l = new THREE.Mesh(new THREE.BoxGeometry(.05, .01, 180),
    new THREE.MeshBasicMaterial({ color: 0x4466ff, transparent: true, opacity: .5 }));
  l.position.set(x, .01, -80); scene.add(l);
});

// Líneas transversales que se desplazan (sensación de velocidad)
const gridLines = [], gridGeo = new THREE.BoxGeometry(10.4, .02, .08);
const gridMat = new THREE.MeshBasicMaterial({ color: 0x00ccff, transparent: true, opacity: .35 });
for (let i = 0; i < 40; i++) { const m = new THREE.Mesh(gridGeo, gridMat); m.position.y = .015; scene.add(m); gridLines.push(m); }

// Pilares de neón laterales
const pylons = [], pyGeo = new THREE.BoxGeometry(.5, 5, .5);
for (let i = 0; i < 24; i++) {
  const left = i % 2 === 0;
  const m = new THREE.Mesh(pyGeo, new THREE.MeshBasicMaterial({ color: left ? 0x00ffff : 0xff2bd6 }));
  m.position.set(left ? -8 : 8, 2.5, 0); scene.add(m); pylons.push(m);
}

// Estrellas de fondo
const NS = 700, sPos = new Float32Array(NS * 3);
for (let i = 0; i < NS; i++) { sPos[i*3] = rnd(-70, 70); sPos[i*3+1] = rnd(-8, 45); sPos[i*3+2] = rnd(-200, 12); }
const sGeo = new THREE.BufferGeometry();
sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
const stars = new THREE.Points(sGeo, new THREE.PointsMaterial({ color: 0xffffff, size: .35, fog: false }));
stars.frustumCulled = false; scene.add(stars);

let scrollOff = 0;
function scroll(dt) {
  scrollOff += G.speed * dt;
  gridLines.forEach((m, i) => m.position.z = -152 + ((i * 4 + scrollOff) % 160));
  pylons.forEach((m, i) => m.position.z = -160 + ((Math.floor(i / 2) * 14 + scrollOff) % 168));
  for (let i = 0; i < NS; i++) {
    sPos[i*3+2] += G.speed * 1.3 * dt + 2 * dt;
    if (sPos[i*3+2] > 12) sPos[i*3+2] = -200;
  }
  sGeo.attributes.position.needsUpdate = true;
}

/* ================= 5. NAVE 3D ================= */
const ship = new THREE.Group(), flames = [];
let shield, engineLight;
(function buildShip() {
  const mB = new THREE.MeshStandardMaterial({ color: 0x1fd8ff, metalness: .8, roughness: .25, emissive: 0x053a52 });
  const mD = new THREE.MeshStandardMaterial({ color: 0x14142b, metalness: .9, roughness: .35 });
  const mG = new THREE.MeshBasicMaterial({ color: 0xff2bd6 });
  const add = (geo, mat, x, y, z, rx = 0, cast = true) => {
    const o = new THREE.Mesh(geo, mat); o.position.set(x, y, z); o.rotation.x = rx; o.castShadow = cast; ship.add(o); return o;
  };
  add(new THREE.BoxGeometry(1, .35, 2.2), mB, 0, .45, 0);                       // chasis
  add(new THREE.ConeGeometry(.5, 1.3, 4), mB, 0, .45, -1.75, -Math.PI / 2);     // morro
  const cab = add(new THREE.SphereGeometry(.38, 16, 12), new THREE.MeshStandardMaterial(
    { color: 0x99ffff, emissive: 0x2299aa, transparent: true, opacity: .85, metalness: .2, roughness: .1 }), 0, .7, -.1);
  cab.scale.set(1, .65, 1.6);                                                    // cabina
  add(new THREE.BoxGeometry(2.7, .07, 1), mD, 0, .4, .5);                        // alas
  [-1, 1].forEach(s => {
    add(new THREE.BoxGeometry(.1, .14, 1), mG, s * 1.35, .42, .5);               // puntas luminosas
    add(new THREE.CylinderGeometry(.2, .26, .8, 12), mD, s * .55, .45, .9, Math.PI / 2); // propulsores
    const f = add(new THREE.ConeGeometry(.17, 1, 12), new THREE.MeshBasicMaterial(
      { color: 0xff8a1a, transparent: true, opacity: .85 }), s * .55, .45, 1.6, Math.PI / 2, false);
    flames.push(f);                                                              // estela de propulsión
  });
  engineLight = new THREE.PointLight(0xff7a22, 1.2, 9); engineLight.position.set(0, .5, 1.8); ship.add(engineLight);
  shield = new THREE.Mesh(new THREE.SphereGeometry(1.6, 16, 12),
    new THREE.MeshBasicMaterial({ color: 0x66ffff, wireframe: true, transparent: true, opacity: .5 }));
  shield.position.y = .6; shield.visible = false; ship.add(shield);
  scene.add(ship);
})();

function updateShip(dt) {
  let tx = LANES[P.lane];
  if (G.state === 'menu') tx = Math.sin(clock.elapsedTime * .7) * 3;          // piloto automático en el menú
  const dx = tx - P.x;
  P.x += dx * Math.min(1, dt * 11);
  // Salto con gravedad
  P.vy -= 34 * dt; P.y += P.vy * dt;
  if (P.y <= 0) { P.y = 0; P.vy = 0; }
  const bob = G.state === 'menu' ? Math.sin(clock.elapsedTime * 2) * .12 + .15 : 0;
  ship.position.set(P.x, P.y + bob, 0);
  // Inclinación: roll por movimiento lateral, pitch por salto
  const roll = Math.max(-.6, Math.min(.6, -(tx - P.x) * .25));
  const pitch = Math.max(-.4, Math.min(.4, P.vy * .03));
  const k = Math.min(1, dt * 10);
  ship.rotation.z += (roll - ship.rotation.z) * k;
  ship.rotation.x += (pitch - ship.rotation.x) * k;
  // Estela / llamas
  const dash = G.dashT > 0;
  flames.forEach(f => { const s = (.8 + Math.random() * .5) * (dash ? 2.4 : 1); f.scale.y = s; f.position.z = 1.3 + .5 * s;
    f.material.color.setHex(dash ? 0xff66ff : 0xff8a1a); });
  engineLight.intensity = dash ? 2.5 : 1.2;
  shield.visible = dash; shield.rotation.y += dt * 4;
  // Partículas de la estela
  trailAcc += dt * 60;
  while (trailAcc >= 1) {
    trailAcc--;
    [-.55, .55].forEach(o => emit(P.x + o, P.y + .45, 1.5, rnd(-.3, .3), rnd(-.2, .3), G.speed * .5, .35, dash ? 0xff66ff : 0xff8a1a));
  }
}
let trailAcc = 0;

/* ================= 6. PARTÍCULAS ================= */
const NP = 320, pPos = new Float32Array(NP * 3).fill(-999), pCol = new Float32Array(NP * 3);
const pVel = new Float32Array(NP * 3), pLife = new Float32Array(NP);
let pIdx = 0;
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const pts = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: .4, vertexColors: true, transparent: true,
  depthWrite: false, blending: THREE.AdditiveBlending }));
pts.frustumCulled = false; scene.add(pts);

function emit(x, y, z, vx, vy, vz, life, col) {
  const i = (pIdx++ % NP) * 3, c = new THREE.Color(col);
  pPos[i] = x; pPos[i+1] = y; pPos[i+2] = z;
  pVel[i] = vx; pVel[i+1] = vy; pVel[i+2] = vz;
  pCol[i] = c.r; pCol[i+1] = c.g; pCol[i+2] = c.b;
  pLife[i / 3] = life;
}
function burst(x, y, z, col, n, sp) {
  for (let i = 0; i < n; i++) emit(x, y, z, rnd(-1, 1) * sp, rnd(-.3, 1) * sp, rnd(-1, 1) * sp + G.speed * .6, rnd(.4, 1.1), col);
}
function updateParticles(dt) {
  const fade = Math.pow(.05, dt);
  for (let n = 0; n < NP; n++) {
    if (pLife[n] <= 0) continue;
    const i = n * 3; pLife[n] -= dt;
    pPos[i] += pVel[i] * dt; pPos[i+1] += pVel[i+1] * dt; pPos[i+2] += pVel[i+2] * dt;
    pCol[i] *= fade; pCol[i+1] *= fade; pCol[i+2] *= fade;
    if (pLife[n] <= 0) pPos[i+1] = -999;
  }
  pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true;
}

/* ================= 7. OBSTÁCULOS Y ORBES ================= */
const BOX = new THREE.BoxGeometry(1, 1, 1), EDGES = new THREE.EdgesGeometry(BOX);
const mk = (c, e) => new THREE.MeshStandardMaterial({ color: c, emissive: e, emissiveIntensity: .55, metalness: .5, roughness: .4 });
const MAT = {
  wall:  [mk(0x3a0a4a, 0xff2bd6), new THREE.LineBasicMaterial({ color: 0xff9af0 })],
  low:   [mk(0x4a2a00, 0xff9a1a), new THREE.LineBasicMaterial({ color: 0xffd08a })],
  mover: [mk(0x4a0a0a, 0xff3344), new THREE.LineBasicMaterial({ color: 0xff9aa5 })],
  bar:   [mk(0x0a2a4a, 0x2b8bff), new THREE.LineBasicMaterial({ color: 0x9acbff })]
};
const ORB = new THREE.SphereGeometry(.4, 12, 10), HALO = new THREE.SphereGeometry(.75, 12, 10);
const matOrb = new THREE.MeshBasicMaterial({ color: 0x6dffb0 });
const matHalo = new THREE.MeshBasicMaterial({ color: 0x6dffb0, transparent: true, opacity: .25, depthWrite: false });
const obstacles = [], orbs = [];

// hx/hy/hz = semi-dimensiones de la caja envolvente (AABB)
function addObs(type, x, y, hx, hy, hz, z) {
  const m = new THREE.Mesh(BOX, MAT[type][0]);
  m.scale.set(hx * 2, hy * 2, hz * 2); m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  m.add(new THREE.LineSegments(EDGES, MAT[type][1]));
  scene.add(m);
  obstacles.push({ m, type, hx, hy, hz, t: 0, ph: rnd(0, 6.28), f: 1.2 + G.level * .15 });
}
const wall = (l, z) => addObs('wall', LANES[l], 1.3, 1.3, 1.3, .8, z);   // alto: hay que esquivarlo
const low  = (l, z) => addObs('low', LANES[l], .5, 1.3, .5, .8, z);      // bajo: se puede saltar
function addOrb(x, y, z) {
  const m = new THREE.Mesh(ORB, matOrb); m.add(new THREE.Mesh(HALO, matHalo));
  m.position.set(x, y, z); scene.add(m); orbs.push(m);
}
const orbLine = (l, z, y) => { for (let i = 0; i < 4; i++) addOrb(LANES[l], y, z - i * 2.4); };

// Genera una fila de obstáculos según el nivel (siempre hay camino libre)
function spawnRow() {
  const z = -135, L = G.level;
  const pool = [0, 1];
  if (L >= 2) pool.push(2, 3);
  if (L >= 3) pool.push(4, 1);
  const k = pick(pool);
  let safe = Math.floor(rnd(0, 3)), oy = 1.2, oz = z - 9;
  if (k === 0) { const b = Math.floor(rnd(0, 3)); wall(b, z); safe = (b + 1 + (Math.random() < .5 ? 0 : 1)) % 3; }
  else if (k === 1) { for (let i = 0; i < 3; i++) if (i !== safe) wall(i, z); }
  else if (k === 2) { for (let i = 0; i < 3; i++) low(i, z); safe = 1; oy = 2.3; oz = z + 2; }  // saltar
  else if (k === 3) addObs('mover', 0, .6, .9, .6, .8, z);                                         // barrera lateral
  else addObs('bar', 0, 1.5, 5.1, .35, .4, z);                                                      // barrera vertical
  if (Math.random() < .55) orbLine(safe, oz, oy);
}

function hit(o) {
  const p = o.m.position;
  return Math.abs(p.x - P.x) < o.hx + .5 && Math.abs(p.z) < o.hz + .9 &&
         p.y + o.hy > P.y + .1 && p.y - o.hy < P.y + .9;
}

function updateObjects(dt) {
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i]; o.t += dt; o.m.position.z += G.speed * dt;
    if (o.type === 'mover') o.m.position.x = Math.sin(o.t * o.f + o.ph) * 3.3;
    if (o.type === 'bar') o.m.position.y = 1.5 + 1.05 * Math.sin(o.t * 2.4 + o.ph);
    if (o.m.position.z > 8) { scene.remove(o.m); obstacles.splice(i, 1); continue; }
    if (G.state === 'playing' && G.dashT <= 0 && hit(o)) crash();
  }
  for (let i = orbs.length - 1; i >= 0; i--) {
    const m = orbs[i]; m.position.z += G.speed * dt;
    m.rotation.y += dt * 3; m.scale.setScalar(1 + Math.sin(clock.elapsedTime * 6 + i) * .1);
    const p = m.position;
    if (G.state === 'playing' && Math.abs(p.x - P.x) < 1 && Math.abs(p.y - (P.y + .5)) < 1.1 && Math.abs(p.z) < 1.3) {
      G.score += 50; G.dashCd = Math.max(0, G.dashCd - 1.5);   // recarga de turbo
      burst(p.x, p.y, p.z, 0x6dffb0, 14, 4); SFX.orb();
      scene.remove(m); orbs.splice(i, 1); continue;
    }
    if (p.z > 8) { scene.remove(m); orbs.splice(i, 1); }
  }
}

/* ================= 8. FLUJO DEL JUEGO ================= */
const show = (id, v) => $(id).classList.toggle('hidden', !v);

function start() {
  SFX.init();
  obstacles.forEach(o => scene.remove(o.m)); obstacles.length = 0;
  orbs.forEach(m => scene.remove(m)); orbs.length = 0;
  Object.assign(G, { state: 'playing', overReady: false, score: 0, time: 0, level: 1, dashT: 0, dashCd: 0, shake: 0, distAcc: 0, speed: 20 });
  Object.assign(P, { lane: 1, x: 0, y: 0, vy: 0 });
  ship.visible = true;
  show('menu', false); show('over', false); show('pause', false);
}

function crash() {
  G.state = 'over'; G.shake = 1;
  burst(P.x, P.y + .6, 0, 0xff4422, 90, 12); burst(P.x, P.y + .6, 0, 0x66ffff, 60, 9);
  ship.visible = false; SFX.crash();
  const f = $('flash'); f.classList.remove('hit'); void f.offsetWidth; f.classList.add('hit');
  const sc = Math.floor(G.score), isNew = sc > best;
  if (isNew) { best = sc; try { localStorage.setItem('neonRunnerBest', best); } catch (e) {} }
  $('fScore').textContent = sc;
  $('fBest').textContent = isNew ? '¡Nuevo récord!' : 'Mejor puntuación: ' + best;
  setTimeout(() => { if (G.state === 'over') { G.overReady = true; show('over', true); } }, 900);
}

function togglePause() {
  if (G.state === 'playing') { G.state = 'paused'; show('pause', true); }
  else if (G.state === 'paused') { G.state = 'playing'; show('pause', false); }
}

const move = d => { if (G.state === 'playing') P.lane = Math.max(0, Math.min(2, P.lane + d)); };
const jump = () => { if (G.state === 'playing' && P.y === 0) { P.vy = 12; SFX.jump(); } };
const dash = () => { if (G.state === 'playing' && G.dashT <= 0 && G.dashCd <= 0) { G.dashT = DASH_DUR; G.dashCd = DASH_CD; G.shake = .3; SFX.dash(); } };

/* ================= 9. ENTRADA (teclado, táctil, botones) ================= */
addEventListener('keydown', e => {
  const c = e.code;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(c)) e.preventDefault();
  SFX.init();
  if (c === 'KeyP' || c === 'Escape') { if (!e.repeat) togglePause(); return; }
  if (G.state === 'menu' || (G.state === 'over' && G.overReady)) { if (c === 'Enter' || c === 'Space') start(); return; }
  if (e.repeat) return;
  if (c === 'ArrowLeft' || c === 'KeyA') move(-1);
  else if (c === 'ArrowRight' || c === 'KeyD') move(1);
  else if (c === 'ArrowUp' || c === 'KeyW' || c === 'Space') jump();
  else if (c === 'ShiftLeft' || c === 'ShiftRight') dash();
});
const bind = (id, fn) => $(id).addEventListener('pointerdown', e => { e.preventDefault(); SFX.init(); fn(); });
bind('tL', () => move(-1)); bind('tR', () => move(1)); bind('tJ', jump); bind('tD', dash);
$('bPlay').onclick = $('bRetry').onclick = start;
$('bPause').onclick = () => { $('bPause').blur(); togglePause(); };
$('bResume').onclick = togglePause;
$('bMute').onclick = () => { SFX.init(); SFX.muted = !SFX.muted; $('bMute').textContent = SFX.muted ? '🔇' : '🔊'; $('bMute').blur(); };
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'playing') togglePause(); });

/* ================= 10. ACTUALIZACIÓN, HUD Y BUCLE ================= */
const clock = new THREE.Clock();
const tf = $('turboFill');

function updateCamera(dt) {
  const fovT = baseFov + (G.dashT > 0 ? 16 : 0) + (G.speed - 20) * .12;
  camera.fov += (fovT - camera.fov) * Math.min(1, dt * 6); camera.updateProjectionMatrix();
  G.shake = Math.max(0, G.shake - dt * 1.8);
  camera.position.set(P.x * .5 + rnd(-1, 1) * G.shake * .5, 4.4 + rnd(-1, 1) * G.shake * .5, 8.6);
  camera.lookAt(P.x * .3, 1.1, -12);
}

function updateHUD() {
  $('score').textContent = Math.floor(G.score);
  $('best').textContent = Math.max(best, Math.floor(G.score));
  $('lvl').textContent = G.level;
  $('spd').textContent = Math.round(G.speed * 4) + ' km/h';
  const active = G.dashT > 0;
  tf.style.width = ((active ? G.dashT / DASH_DUR : 1 - G.dashCd / DASH_CD) * 100) + '%';
  tf.style.background = active ? '#fff' : (G.dashCd <= 0 ? 'linear-gradient(90deg,#f0f,#0ff)' : '#08a');
}

function update(dt) {
  let target = 20;
  if (G.state === 'playing') {
    G.time += dt; G.level = 1 + Math.floor(G.time / 20);
    G.dashT = Math.max(0, G.dashT - dt); G.dashCd = Math.max(0, G.dashCd - dt);
    target = Math.min(22 + G.time * .55, 62) * (G.dashT > 0 ? 1.8 : 1);   // velocidad progresiva
    G.score += G.speed * dt * .5 * (G.dashT > 0 ? 2 : 1);                  // turbo duplica puntos
    G.distAcc += G.speed * dt;
    if (G.distAcc >= Math.max(16, 34 - G.level * 2)) { G.distAcc = 0; spawnRow(); }
  } else if (G.state === 'over') target = 0;
  G.speed += (target - G.speed) * Math.min(1, dt * (G.state === 'over' ? 3 : 5));
  scroll(dt);
  if (G.state !== 'over') updateShip(dt);
  updateObjects(dt); updateParticles(dt); updateCamera(dt); updateHUD();
}

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); camera.aspect = w / h;
  baseFov = w / h < 1 ? 88 : 70;           // más campo de visión en vertical
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

(function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05);   // delta time: igual en 60/120/144 Hz
  if (G.state !== 'paused') update(dt);
  renderer.render(scene, camera);
})();
})();
</script>
</body>
